name: Release

# Each merge into main releases what its fragments describe. A manual run
# (`gh workflow run publish.yml -f version=minor`) forces a bump.
# npm trusted publishing is bound to this file name: keep the publish job here,
# and do not call it from another workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version: `auto` follows the fragments; `patch`, `minor` or `major` forces that bump"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time. GitHub keeps only the newest pending run: it
# releases everything that main has at that point.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      - run: npm install --no-audit --no-fund --no-progress oxlint

      - name: Validate config
        run: npx oxlint -c oxlintrc.json --print-config > /dev/null

  # Folds the fragments, bumps package.json, commits `Release <version>`,
  # tags, pushes and creates the GitHub release.
  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Release
        id: release
        uses: weareikko/changelog@fce59bfe7b620305dfcc222f1b150dda9c3cc157 # 0.1.3
        with:
          command: release
          version: ${{ inputs.version || 'auto' }}

  # "Re-run failed jobs" on this job publishes what a failed run left: npm
  # skips a version that it already has.
  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ needs.release.outputs.version }}

      # Trusted publishing needs npm 11.5.1 or later: Node.js 24 has it.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      # Trusted publishing (OIDC): no npm token. A prerelease goes to `next`.
      - uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          access: public
          provenance: true
          tag: ${{ needs.release.outputs.dist-tag }}
